services:
  - type: web
    name: chollobici-admin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn admin_panel.app:app --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: GITHUB_OWNER
        value: fberme84
      - key: GITHUB_REPO
        value: chollobici
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
