name: SEO Mini Monitor

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SEO mini monitor
        env:
          CHOLLOBICI_BASE_URL: https://www.chollobici.com
          SEO_MONITOR_MAX_PRODUCT_CHECKS: "12"
        run: python scripts/seo_mini_monitor.py
