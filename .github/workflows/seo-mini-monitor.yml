name: SEO Mini Monitor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seo-mini-monitor.yml
      - scripts/seo_mini_monitor.py
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SEO mini monitor
        env:
          CHOLLOBICI_BASE_URL: https://www.chollobici.com
          SEO_MONITOR_MAX_PRODUCT_CHECKS: "12"
        run: python scripts/seo_mini_monitor.py

      - name: Alert on failure
        if: ${{ failure() }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python scripts/send_alert_webhook.py \
            --workflow "SEO Mini Monitor" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
