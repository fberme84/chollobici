<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CholloBici - Ofertas en ciclismo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .header {
      background: #0d47a1;
      color: white;
      padding: 15px;
      font-weight: bold;
      font-size: 20px;
    }

    .container {
      padding: 15px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: white;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .product-card:hover {
      transform: scale(1.02);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
    }

    .product-card h3 {
      font-size: 14px;
      margin: 8px 0;
    }

    .price {
      font-weight: bold;
      color: #e53935;
    }

    .btn-buy {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: #0d47a1;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="header">🚴 CholloBici</div>

  <div class="container">
    <div id="products-container" class="products-grid"></div>
  </div>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch("data/products.json");
        const data = await res.json();

        renderProducts(data);
      } catch (e) {
        console.error("Error cargando productos", e);
      }
    }

    function renderProducts(products) {
      const container = document.getElementById("products-container");
      container.innerHTML = "";

      products.forEach(product => {
        const card = document.createElement("div");
        card.className = "product-card";

        // 🔥 CLICK A FICHA (SEO)
        card.onclick = () => {
          window.location.href = "/producto/" + product.slug + ".html";
        };

        card.innerHTML = `
          <img src="${product.image || ''}" alt="${product.title}">
          <h3>${product.title}</h3>
          <div class="price">${product.price || ''}</div>

          <!-- 🎯 BOTÓN AFILIADO -->
          <a href="${product.url}" 
             target="_blank" 
             class="btn-buy"
             onclick="event.stopPropagation();">
             Ver oferta
          </a>
        `;

        container.appendChild(card);
      });
    }

    loadProducts();
  </script>

</body>
</html>
